<aside
  class="fixed inset-y-0 left-0 z-50 flex w-[260px] flex-col border-r border-[var(--border)]
         bg-[var(--bg-surface)] transition-transform duration-200 ease-[var(--ease-out-expo)]
         md:translate-x-0"
  [class.-translate-x-full]="!isOpen()"
  [class.translate-x-0]="isOpen()"
>
  <!-- Logo -->
  <div class="flex h-16 items-center gap-3 border-b border-[var(--border)] px-5">
    <div class="flex h-9 w-9 items-center justify-center rounded-[0.625rem] bg-[var(--primary)]">
      <span class="text-sm font-bold text-white">O</span>
    </div>
    <span class="text-lg font-bold text-[var(--text-primary)]">OsbErpLite</span>
    <button
      class="ml-auto flex h-8 w-8 items-center justify-center rounded-lg text-[var(--text-muted)]
             transition-colors duration-150 hover:bg-[var(--bg-muted)] hover:text-[var(--text-primary)] md:hidden"
      (click)="closeSidebar.emit()"
      aria-label="Menüyü kapat"
    >
      <i class="ph-light ph-x text-xl"></i>
    </button>
  </div>

  <!-- Nav -->
  <nav class="flex-1 overflow-y-auto px-3 py-4" role="navigation" aria-label="Ana menü">
    <ul class="space-y-1">
      @for (item of visibleNavItems; track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium
                   text-[var(--text-secondary)] transition-colors duration-150
                   hover:bg-[var(--bg-muted)] hover:text-[var(--text-primary)]"
            (click)="onNavClick()"
          >
            <i class="ph-light text-xl" [ngClass]="'ph-' + item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Footer -->
  <div class="border-t border-[var(--border)] px-3 py-3">
    <!-- Theme toggle -->
    <button
      class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium
             text-[var(--text-secondary)] transition-colors duration-150
             hover:bg-[var(--bg-muted)] hover:text-[var(--text-primary)]"
      (click)="themeService.toggle()"
      [attr.aria-label]="themeService.isDark() ? 'Açık temaya geç' : 'Koyu temaya geç'"
    >
      @if (themeService.isDark()) {
        <i class="ph-light ph-sun text-xl"></i>
        <span>Açık Tema</span>
      } @else {
        <i class="ph-light ph-moon text-xl"></i>
        <span>Koyu Tema</span>
      }
    </button>

    <!-- User info -->
    @if (currentUser; as user) {
      <div class="mt-1 flex items-center gap-3 rounded-lg px-3 py-2.5">
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-[var(--primary-soft)]
                    text-xs font-semibold text-[var(--primary)]">
          {{ user.username.charAt(0).toUpperCase() }}
        </div>
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium text-[var(--text-primary)]">{{ user.username }}</p>
          <p class="text-xs text-[var(--text-muted)]">{{ roleLabel }}</p>
        </div>
      </div>
    }
  </div>
</aside>

<!-- Backdrop (mobile) -->
@if (isOpen()) {
  <div
    class="fixed inset-0 z-40 bg-black/50 md:hidden"
    (click)="closeSidebar.emit()"
    aria-hidden="true"
  ></div>
}
